; =============================================================================
; E-MESH Firmware — PlatformIO Configuration
; =============================================================================
; Two build environments: ESP32-WROOM and ESP32-C3-Mini
; Usage:
;   pio run -e wroom -t upload     # Flash WROOM board
;   pio run -e c3 -t upload        # Flash C3 board
; =============================================================================

[platformio]
src_dir = main

[env]
platform = espressif32
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions.csv

[env:wroom]
board = esp32dev
build_flags =
    -DBOARD_WROOM

[env:c3]
board = esp32-c3-devkitm-1
build_flags =
    -DBOARD_C3
